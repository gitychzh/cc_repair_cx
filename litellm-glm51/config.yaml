# ============================================================
# GLM-5.1 LiteLLM Router — 7 Tier-1 only (lowercase)
# ============================================================
#
# Optimization based on log analysis (2026-05-27/28):
#   - All 429 errors are "insufficient_quota" (TPS/TPM throttle),
#     NOT real quota exhaustion. ModelScope per-key limit: 200 RPM.
#   - Mixed-case model names (ZhipuAI/GLM-5.1) cause "Unsupported
#     model" errors on ModelScope. Only lowercase zhipuai/glm-5.1 works.
#   - null-choices (choices=None) errors: 8 cases in 392 requests
#     (2.0%). LiteLLM treats as InternalServerError, won't retry.
#   - Previous config had 49 deployments (7 T1 + 42 mixed-case),
#     wasting cooldown slots on broken deployments.
#
# Changes from previous config:
#   1. REMOVED all mixed-case deployments (42 entries) — they cause
#      "Unsupported model" errors, wasting retry attempts and cooldown slots
#   2. rpm: 1 → 10 — ModelScope allows 200 RPM/key; 10 is conservative
#      but avoids LiteLLM over-throttling per-deployment
#   3. tpm: 500000 added — per ModelScope TPM limits
#   4. timeout: 120 → 180 — GLM-5.1 is slow on large inputs (avg 13s,
#      max 129s observed); 180s prevents premature timeouts
#   5. cooldown_time: 60 → 20 — faster recovery after 429 throttle
#   6. num_retries: 5 → 3 — reduces total retry latency; proxy already
#      has its own retry layer
#   7. RateLimitErrorAllowedFails: 1 → 3 — avoids premature cooldown
#      for temporary TPS throttle spikes
#   8. routing_strategy: latency-based-routing → simple-shuffle —
#      latency-based can over-concentrate on "fast" deployments causing
#      TPS throttle; simple-shuffle distributes load evenly across all 7 keys
#
# 7 keys × 1 model = 7 deployments
# ============================================================

model_list:
  - model_name: glm5.1
    litellm_params: &glm51_t1
      model: openai/zhipuai/glm-5.1
      api_base: os.environ/MS_BASEURL
      api_key: os.environ/MS_KEY1
      rpm: 10
      tpm: 500000
      timeout: 180
      allowed_openai_params: &glm_allowed
        - max_tokens
        - max_completion_tokens
        - reasoning_effort
        - temperature
        - top_p
        - stream
        - stop
        - tools
        - tool_choice
        - frequency_penalty
        - presence_penalty
        - n
        - user
        - response_format
        - seed
        - logprobs
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY2
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY3
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY4
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY5
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY6
    model_info:
      mode: chat
      max_tokens: 131072

  - model_name: glm5.1
    litellm_params:
      <<: *glm51_t1
      api_key: os.environ/MS_KEY7
    model_info:
      mode: chat
      max_tokens: 131072

litellm_settings:
  drop_params: false
  json_logs: true
  store_prompts_in_spend_logs: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: false

router_settings:
  num_retries: 3
  cooldown_time: 20
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  allowed_fails_policy:
    BadRequestErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 3
    TimeoutErrorAllowedFails: 3
